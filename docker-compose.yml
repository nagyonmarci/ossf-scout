services:
  ossf-scout:
    build:
      context: .
      args:
        BUILDKIT_INLINE_CACHE: "1"
    ports:
      - "7878:7878"
    volumes:
      - ./data:/app/data
    environment:
      # GitHub
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      # AI providers
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Ollama (point to local or remote Ollama instance)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Notifications (Slack incoming webhook or any HTTP POST endpoint)
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      # Cost guard: reject audits whose estimated cost exceeds this (USD). Leave empty to disable.
      MAX_AUDIT_COST_USD: ${MAX_AUDIT_COST_USD:-}
      # Auth: set to "true" to require Authentik forward-auth headers (X-Authentik-Username)
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
    command: ["ossf-scout", "-serve", "-port", "7878", "-db", "/app/data/ossf-scout.db"]

  # Offline/air-gapped profile: Ollama sidecar — enable with:
  #   OLLAMA_BASE_URL=http://ollama:11434 docker compose --profile offline up
  ollama:
    image: ollama/ollama:latest
    profiles: [offline]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  ollama_data:
